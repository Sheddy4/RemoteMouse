name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore app/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -keyalg RSA \
            -keysize 2048

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          DATE=$(date +'%Y-%m-%d_%H-%M')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/RemoteMouse-${DATE}-${SHORT_SHA}.apk
          echo "APK_NAME=RemoteMouse-${DATE}-${SHORT_SHA}.apk" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${DATE}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Delete old 'latest' release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true  # не падать если релиза ещё нет

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🚀 Latest Build"
          body: |
            ### RemoteMouse — автосборка

            **Коммит:** `${{ github.sha }}`
            **Ветка:** `${{ github.ref_name }}`
            **Дата:** ${{ github.event.head_commit.timestamp }}

            ---
            📱 **Скачай APK ниже** и установи на Android.
            > Перед установкой разреши установку из неизвестных источников:
            > Настройки → Безопасность → Неизвестные источники
          files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
