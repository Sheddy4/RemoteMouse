name: Build & Release APK + Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore app/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -keyalg RSA \
            -keysize 2048

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          DATE=$(date +'%Y-%m-%d_%H-%M')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/RemoteMouse-${DATE}-${SHORT_SHA}.apk
          echo "APK_NAME=RemoteMouse-${DATE}-${SHORT_SHA}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          retention-days: 1

  build-server:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build server .exe
        working-directory: server
        run: |
          pyinstaller --onefile --console --name RemoteMouseServer server.py

      - name: Package source .zip
        run: |
          Compress-Archive -Path server\server.py, server\requirements.txt, server\start_server.bat -DestinationPath RemoteMouseServer-src.zip

      - name: Upload server exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-exe
          path: server/dist/RemoteMouseServer.exe
          retention-days: 1

      - name: Upload server source zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-src-zip
          path: RemoteMouseServer-src.zip
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [ build-android, build-server ]

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android

      - name: Download server exe artifact
        uses: actions/download-artifact@v4
        with:
          name: server-exe
          path: dist/server

      - name: Download server src zip artifact
        uses: actions/download-artifact@v4
        with:
          name: server-src-zip
          path: dist/server

      - name: Delete old 'latest' release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true  # не падать если релиза ещё нет

      - name: Create Release with APK + Server
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🚀 Latest Build"
          body: |
            ### RemoteMouse — автосборка

            **Коммит:** `${{ github.sha }}`
            **Ветка:** `${{ github.ref_name }}`

            ---
            📱 **APK** — установи на Android.
            > Перед установкой разреши установку из неизвестных источников:
            > Настройки → Безопасность → Неизвестные источники

            💻 **Сервер (Windows)**:
            - `RemoteMouseServer.exe` — готовый исполняемый файл, Python не нужен
            - `RemoteMouseServer-src.zip` — исходники (server.py + requirements.txt + start_server.bat), если нужен Python-запуск
          files: |
            dist/android/*.apk
            dist/server/RemoteMouseServer.exe
            dist/server/RemoteMouseServer-src.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
